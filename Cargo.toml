# 遊びを並べて、テレビの前で選ばせる。
#
#   home/               起動・メニュー・装置（マイク / whisper / スピーカー / ウィンドウ / リモコン）
#   kit/                遊びと装置の継ぎ目。トレイトと、描く図形だけ
#   games/<name>/       遊びそのもの。kit だけを読む
#
# **遊びから home を読んではいけない。** home はメニューに並べるために
# 遊びを読むので、逆を許すと循環する。共通の口は kit に置く。
# 遊びの側が装置に触れないのも、この依存の向きがそのまま保証している。
[workspace]
resolver = "2"
members = ["home", "kit", "vision", "games/*"]
# `cargo run` / `cargo build` を素で叩いたときに組むのは home。
# 遊びは home から依存で引かれるので、ここに並べなくても組まれる。
default-members = ["home"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
# Color::COUNT を数える（EnumCount）。手で持つと色を足したときに
# 更新し忘れるので、変種の数は derive に任せる。
strum = { version = "0.28", features = ["derive"] }
# const fn の中で for を回す。Iterator::next が const でないため素では
# 書けない。break / continue も正しく扱う。依存はゼロ。
const_for = "0.1"

kit = { path = "kit" }
vision = { path = "vision" }
donna-iro = { path = "games/donna-iro" }
balloon-crash = { path = "games/balloon-crash" }
fish-catch = { path = "games/fish-catch" }
