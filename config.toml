# 設定。装置のつまみと、遊びごとの節（[games.<name>]）。
#
# ここに書いてある値がそのまま既定値。消せばコード上の既定に戻る。
# 各項目は環境変数でも上書きできる。名前はキーの位置から機械的に決まる。
# 節とキーの区切りは `__`（2本）。キー名自体に `_` が入るため。
#
#   cargo run                             この config.toml を読む
#   cargo run -- --config other.toml      別のファイルを読む
#   CHILD_GAMES_RECOGNIZE__AUDIO_CTX=512 cargo run
#                                         一時的に上書き（ファイルは触らない）

[paths]
# 遊びを並べたディレクトリ。空なら games（このリポジトリの並び）。
# 素材は <games>/<name>/assets/ から読む。揃っていなければ
# <games>/<name>/assets/reference/（確認用の合成音）に落ちる。
# つくよみちゃんの音源を games/donna-iro/assets/ に置いた時点で自動で切り替わる。
#   CHILD_GAMES_PATHS__GAMES
games = ""

# whisper のモデル。空なら models/ggml-base.bin。
# 埋め込みビルドでも、ここが指定されていればファイルから読む。
#   CHILD_GAMES_PATHS__MODEL
model = ""


[listen]
# 使う入力デバイス。名前の一部を書けば選べる。
#
# **書くのは ALSA のカード名。** `arecord -l` は
# 「カード 2: V15AF [Nuroum Webcam V15AF]」と2つの名前を見せるが、cpal に
# 見えるのは前者だけ（`hw:CARD=V15AF,DEV=0` など）。**製品名で書くと当たらない。**
# 実際に "Nuroum" と書いてあって当たらず、既定に落ちて開けずに死んでいた。
# 空なら OS の既定に任せる。
#
# **見つからなければ警告を出して OS の既定で続ける。** テレビに繋ぎっぱなしの
# 玩具なので、起動しないほうが困る。既定も無いときだけエラーで止まる。
#
# ただし黙って切り替えはしない。名前を指定したのに違うマイクで動いていて
# 精度が出ない、が一番たちが悪いので、起動時のログに「⚠」の行が出る。
# 会議アプリが既定を奪ったり、ラズパイで USB マイクが既定にならなかったり
# するので、本番は書いておく。
#
# 見えているデバイス名は、起動時に出る「マイク ...」の行で分かる。
#   CHILD_GAMES_LISTEN__DEVICE
device = "V15AF"

# 応答を待つ上限（秒）。2歳児は考えてから言うので短すぎると取りこぼす。
# 0.01〜60 の範囲。guard_ms + min_speech_ms がこの窓に収まらないと、
# 何を言っても無言になるので起動時に弾く。
#   CHILD_GAMES_LISTEN__MAX_SECONDS
max_seconds = 5.0

# 声が途切れてから打ち切るまでの猶予（ミリ秒）。
# 短くするほど反応が速くなるが、言い淀みで切れやすくなる。
#   CHILD_GAMES_LISTEN__HANGOVER_MS
hangover_ms = 350

# 窓を開けた直後、スピーカーの残響で誤発火しないよう判定を止める時間。
# 録音自体は続くので、この間に話し始めても声は残る。
#   CHILD_GAMES_LISTEN__GUARD_MS
guard_ms = 200

# 窓を開ける前のぶんを、どれだけ遡って残すか（ミリ秒）。0〜2000。
#
# **子どもは歌に被せて答える。**「どんないろがすき」の「すき」あたりから
# 言い始めるので、鳴り止んでから録り始めると答えの頭が欠ける。実機で
# 「んぶ」（ぜんぶ）「より」（みどり）「たん」（あか）になっていたのがこれ。
# 欠けたものは判定では足せないので、録音のほうを遡らせる。
#
# 700 で「がすき」あたりから入る。前に伸ばすほど質問が丸ごと入って、
# 回り込みを落とす仕掛けに頼りきりになる。0 にすると昔の挙動（鳴り止んで
# から録り始める）に戻る。
#
# **判定の窓は動かない。** 声を拾ったとみなす時刻も guard_ms もそのままで、
# 増えるのは録れている音だけ。起動ログの「音声 X秒」がそのぶん伸びる。
#   CHILD_GAMES_LISTEN__PREROLL_MS
preroll_ms = 700

# これだけ続けて初めて「聞こえた」とみなす（ミリ秒）。単発のノイズを弾く。
#   CHILD_GAMES_LISTEN__MIN_SPEECH_MS
min_speech_ms = 75

# 発話とみなす音量。起動時に測った環境ノイズの ratio 倍を使い、
# floor と ceil で挟む。環境ノイズは毎回の観測で更新される。
#
# 拾いすぎのコストはほぼゼロ（誤検出してもランダムな色が鳴るだけで、
# 何も聞こえなかった場合と結果が同じ）。逆に取りこぼすと子どもが
# 答えたのに無視される。迷ったら緩める側に倒すこと。
# 振幅は ±1 に正規化してあるので floor / ceil / threshold の上限は 1。
#   CHILD_GAMES_LISTEN__SPEECH_RATIO / __SPEECH_FLOOR / __SPEECH_CEIL
speech_ratio = 2.0
speech_floor = 0.005
speech_ceil = 0.015

# 0 より大きければ、環境ノイズを見ずにこの値で固定する。
# 判定のたびに出る「最大 0.0xx」を見て決めるとよい。
#   CHILD_GAMES_LISTEN__THRESHOLD
threshold = 0.0


[recognize]
# エンコーダの文脈長。**0 なら音声の長さから毎回決める（既定）。**
#
# whisper は入力を必ず30秒ぶん（=1500）に詰めてからエンコードするので、
# ここを切るとそのぶん計算量が落ちる。**目安は1秒あたり 50**（30秒 = 1500）。
# パディングには情報が無いので、実際に鳴ったぶんを覆っていれば精度は落ちない。
# 落ちるのは実音声より短く切ったときだけ。
#
# 0 のときは「長さ×50 + 1秒ぶんの余裕」を 128〜1500 に収めた値になる。
# 実際に使われた値は認識のたびに出る「audio_ctx N」で分かる。
#
# ラズパイ実測（音声 2.0〜2.3秒 / 大人の声）:
#
#   1500（切り詰めなし）→ 2.79秒 / 2.72秒   判定 あか / ぜんぶ
#    384（固定）        → 0.66秒 / 0.78秒   判定 あか / ぜんぶ（同じ）
#    0（長さから）      → 150〜160 になる
#
# **128〜1500 を書くとその値に固定する。** 子どもの声で精度が出なかったとき、
# モデルを大きくするよりここを戻すほうが効いた、という実測がある。上の計測は
# 大人の声で2回きりなので、外すなら 768 → 1500 と固定して戻すこと。
#   CHILD_GAMES_RECOGNIZE__AUDIO_CTX
audio_ctx = 0


[camera]
# 使うカメラ。名前の一部を書けば選べる。空なら最初に見つかったもの。
#
# **開けるカメラが1台も無ければ起動時にエラーで止まる。** 名前に当たる
# ものを、開けるまで順に試す（1台が同じ名前で開けない口も出すことがある）。
# 見つからない名前を書いたときは、マイクと同じく警告を出して全部を試す。
# 起動時の「カメラの候補」と「カメラ ...」の行で、見えているものと使って
# いるものが分かる。
#
# 開くのは起動時だが、撮るのはカメラで遊ぶ遊びの間だけ。ほかの遊びの間は
# ランプが点かない。映像は画面に出すだけで、保存も送信もしない。
#   CHILD_GAMES_CAMERA__DEVICE
device = ""

# --- 遊びごとの節 ---
#
# 節の名前は遊びの名前の - を _ にしたもの（環境変数に - は使えない）。

[games.donna_iro]
# どんないろがすき？

# 何周に1回、区切り（ブリッジまたは間奏）を挟むか。
#   CHILD_GAMES_GAMES__CHILD_GAMES__INSERT_EVERY
insert_every = 3

# フィナーレで色を差し替える間隔（ミリ秒）。
#   CHILD_GAMES_GAMES__CHILD_GAMES__FLASH_MS
flash_ms = 500

# 認識結果の先頭いくつの区間を信用するか。
# tiny は短い音を渡されるとデコーダが暴走し、言っていない語を後ろに
# 継ぎ足す（「あお」に対して「あお、おれんじ、あか」）。だから後ろは捨てる。
# 1 にすると「えーと、あか」のような言い淀みを落とす。
# **フィラーが1枠食う。** 「えー、みどり」のような言い方だと「えー」で
# 1つ使うので、2 だと色まで届くのがぎりぎりになる。増やすと届きやすく
# なるが、tiny が後ろに継ぎ足す幻覚も拾いやすくなる。
#   CHILD_GAMES_GAMES__CHILD_GAMES__HEAD_SEGMENTS
head_segments = 2


[games.balloon_crash]
# ふうせんタッチ

# 画面に同時に出す風船の数。1〜6。多いと、どれを狙うかで迷う。
#   CHILD_GAMES_GAMES__BALLOON_CRASH__MAX_BALLOONS
max_balloons = 3

# 明るさがこれだけ変わったら「動いた」とみなす（1〜255）。
# 下げるほど小さな動きで割れるが、カメラのざらつきでも割れやすくなる。
#   CHILD_GAMES_GAMES__BALLOON_CRASH__THRESHOLD
threshold = 16

# 風船の中で、これだけの割合が動いたら割る（0 より大きく 1 以下）。
# 下げるほど指先でも割れる。上げると体ごとぶつからないと割れない。
#   CHILD_GAMES_GAMES__BALLOON_CRASH__TOUCH_RATIO
touch_ratio = 0.1

# 動いた所に小さな点を出す。しきい値を決めるときに使う。
#   CHILD_GAMES_GAMES__BALLOON_CRASH__SHOW_MOTION
show_motion = false


[games.fish_catch]
# おさかなキャッチ！

# 池に同時に泳がせる魚の数。1〜4。
#   CHILD_GAMES_GAMES__FISH_CATCH__MAX_FISH
max_fish = 3

# 明るさがこれだけ変わったら「動いた」とみなす（1〜255）。
#   CHILD_GAMES_GAMES__FISH_CATCH__THRESHOLD
threshold = 16

# 魚のまわりで、これだけの割合が動いたら「つかんだ」とみなす（0 より大きく 1 以下）。
# 低く取ってある。数に入るのは明るさが変わった升目、つまり手の縁だけなので、
# 魚のまわりで手を揺らしても 5〜10% にしかならない。
#   CHILD_GAMES_GAMES__FISH_CATCH__GRAB_RATIO
grab_ratio = 0.04

# 釣れる振り上げの速さ（キャンバス 1280×720 の画素 / 秒）。50〜1000。
# 上限は測れる速さで決まる。カメラが毎秒13枚（ラズパイの V15AF、暗い部屋）なら
# 毎秒 1040 画素まで。
# 魚の左右どちらかが、これ以上で上へ動けば釣れる（片手でよい）。逃げるたびに
# 下がり（最大で半分）、釣れたら元に戻る。
#   CHILD_GAMES_GAMES__FISH_CATCH__SWING_SPEED
swing_speed = 300.0

# 動きの向き（上は緑、下は赤）と、振り上げの強さの棒を画面に出す。
# 棒が白い線まで伸びれば足りている。しきい値を決めるときに使う。
#   CHILD_GAMES_GAMES__FISH_CATCH__SHOW_MOTION
show_motion = false


[games.takoyaki]
# たこやき くるりん！

# 片面が焼けるまでの秒数の下限と上限（1〜30、cook_min ≦ cook_max）。
# 穴ごとに、この間でばらつかせる。焼ける順番が自然にばらける。
#   CHILD_GAMES_GAMES__TAKOYAKI__COOK_MIN / __COOK_MAX
cook_min = 4.0
cook_max = 8.0

# 明るさがこれだけ変わったら「動いた」とみなす（1〜255）。
#   CHILD_GAMES_GAMES__TAKOYAKI__THRESHOLD
threshold = 16

# 穴の中で、これだけの割合が動いたら「つついた」とみなす（0 より大きく 1 以下）。
# 低く取ってある。数に入るのは明るさが変わった升目、つまり指の縁だけなので。
#   CHILD_GAMES_GAMES__TAKOYAKI__POKE_RATIO
poke_ratio = 0.04

# 穴の中で、これだけの割合が動いたら「つかんだ」とみなす（0 より大きく 1 以下）。
#   CHILD_GAMES_GAMES__TAKOYAKI__GRAB_RATIO
grab_ratio = 0.04

# 舟皿へ飛ぶ振り上げの速さ（キャンバス 1280×720 の画素 / 秒）。50〜1000。
# たこ焼きの左右どちらかが、これ以上で上へ動けば飛ぶ（片手でよい）。落とすたびに
# 下がり（最大で半分）、乗ったら元に戻る。
#   CHILD_GAMES_GAMES__TAKOYAKI__SWING_SPEED
swing_speed = 280.0

# 動いた所の点、動きの向き（上は緑、下は赤）、振り上げの強さの棒を画面に出す。
#   CHILD_GAMES_GAMES__TAKOYAKI__SHOW_MOTION
show_motion = false
